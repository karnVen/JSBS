<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changing Clock</title>
    
    <style>
        
        body {
            font-family: Arial, sans-serif;
            
            transition: background-color 0.5s ease-in-out;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .clock-container {
            width: 300px;
            height: 300px;
            background-color: #ffffff;
            border-radius: 50%;
            position: relative;
            border: 8px solid #f0f0f0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .hand {
            position: absolute;
            width: 50%;
            background-color: #333;
            top: 50%;
            transform-origin: 100%;
            transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.6, 1);
        }

        .hour-hand {
            height: 6px;
            border-radius: 3px;
        }

        .minute-hand {
            height: 4px;
            border-radius: 2px;
        }

        .second-hand {
            height: 2px;
            background-color: #ef4444; 
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>
<body>

  
    <div class="clock-container">
       
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
        
        <div class="center-dot"></div>
    </div>

    
    <script>
      
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');

         
        const hexColors = [
            "#FF5733", "#33FF57", "#3357FF", "#F1C40F", "#8E44AD",
            "#1ABC9C", "#E74C3C", "#2ECC71", "#3498DB", "#9B59B6",
            "#34495E", "#16A085", "#27AE60", "#2980B9", "#D35400",
            "#C0392B", "#BDC3C7", "#7F8C8D", "#FF6F61", "#6B5B95",
            "#88B04B", "#F7CAC9", "#92A8D1", "#955251", "#B565A7"
        ];

        
        function updateClock() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();


            const secondsDegrees = ((seconds / 60) * 360) + 90;
            const minutesDegrees = ((minutes / 60) * 360)  + 90;
            const hoursDegrees = ((hours / 12) * 360)  + 90;

            
            secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `rotate(${hoursDegrees}deg)`;
        }

        
        function changeBackgroundColor() {

            const idx = Math.floor(Math.random() * hexColors.length);
            
            document.body.style.backgroundColor = hexColors[idx];
        }

        
        setInterval(() => {
            updateClock();
            changeBackgroundColor();
        }, 1000);

       
        updateClock();
        changeBackgroundColor();
    </script>
</body>
</html>
