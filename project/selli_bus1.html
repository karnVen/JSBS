<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Webhook Client</title>
</head>
<body>

    <!-- Form to capture user input -->
    <form id="webhookForm">
        <input type="text" id="inputField" placeholder="Enter text here" required>
        <button type="submit">Submit</button>
    </form>

    <!-- Div to display the response from the webhook -->
    <div id="responseArea"></div>

    <script>
        // Generate a simple random session key when the script loads
        const sessionKey = Math.random().toString(36).substring(2, 15);

        // Add an event listener for the form's submit event
        document.getElementById('webhookForm').addEventListener('submit', function(event) {
            // Prevent the default form submission which reloads the page
            event.preventDefault();

            const inputValue = document.getElementById('inputField').value;
            const webhookUrl = 'https://karnven3o.app.n8n.cloud/webhook/520ebc9d-b14b-40a7-8645-17c494165dab';

            // Prepare the data payload to be sent as JSON, including the session key
            const data = {
                sessionKey: sessionKey,
                data: inputValue
            };

            // Use the Fetch API to send a POST request
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => {
                // Check if the request was successful
                if (response.ok) {
                    // Attempt to parse the response as JSON
                    return response.json();
                }
                // If not successful, throw an error
                throw new Error('Network response was not ok.');
            })
            .then(responseData => {
                // Log the full response to the console for debugging
                //console.log('Response Received:', responseData);

                // Display the response from the webhook
                const responseArea = document.getElementById('responseArea');
               // if (typeof responseData === 'object' && responseData !== null && responseData.output) {
                    // If the response is an object with an 'output' field, display its value
                    responseArea.textContent = responseData.output;
               // } else {
                    // Otherwise, display the raw response (converted to a string if it's an object)
               //     responseArea.textContent = JSON.stringify(responseData);
               // }
            })
         /*   .catch((error) => {
                // Handle any errors that occurred during the fetch
                console.error('Error:', error);
                document.getElementById('responseArea').textContent = 'Error: Could not fetch response.';
            })*/;
        });
    </script>

</body>
</html>
