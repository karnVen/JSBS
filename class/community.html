<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Website</title>
     <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* Prevent scrolling on the body */
        background-color: black; /* Added a fallback background */
    }

    body {
        background-image: url(h.png);
        background-size: cover; /* Ensure background covers entire viewport */
        background-repeat: no-repeat;
        background-position: center;
    }

    .spline-container {
        position: relative;
        width: 100vw;  /* full viewport width */
        height: 100vh; /* full viewport height */
        overflow: hidden; /* Prevent overflow inside container */
    }
    
    spline-viewer {
        width: 100%;
        height: 100%;
        display: block;
    }

    .overlay-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        color: white;
        display: flex;
        flex-direction: column; /* Stack items vertically */
        justify-content: center; /* Vertically center */
        align-items: center; /* Horizontally center */
        text-align: center;
        font-size: 2rem;
        user-select: none;
        z-index: 100; /* Ensure text is above everything */
    }

    .overlay-content > * {
        max-width: 500px; /* optional, limit width */
        text-shadow: 0 0 10px rgba(0,0,0,0.5); /* Add shadow for readability */
    }

    .floating-column {
        position: absolute;
        top: 0;
        height: 100vh; /* Full viewport height */
        width: 20%;   /* Adjust width as needed */
        overflow-y: scroll;
        z-index: 10; /* Above Spline, below main text */

        /* --- Hide scrollbar --- */
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }

    .floating-column::-webkit-scrollbar {
        display: none; /* Chrome, Safari, and Opera */
    }

    .left-column {
        left: 2%; 
    }

    .right-column {
        right: 2%;
    }
    
    .floating-box {
        width: 200px;
        height: 150px;
        background-color: rgba(255, 255, 255, 0.1); 
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        margin: 3rem auto;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        animation: floatAnimation 7s ease-in-out infinite;
        
        /* --- NEW: Needed for positioning the link and iframe container --- */
        position: relative;
        overflow: hidden; /* This will clip the scaled iframe */
    }

    .floating-column .floating-box:nth-child(2n) {
        animation-delay: -3.5s;
        background-color: rgba(138, 43, 226, 0.15); /* BlueViolet */
    }
    .floating-column .floating-box:nth-child(3n) {
        background-color: rgba(0, 191, 255, 0.15); /* DeepSkyBlue */
    }
    .floating-column .floating-box:nth-child(4n) {
        animation-delay: -2s;
    }

    @keyframes floatAnimation {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
    }

    /* --- NEW CSS FOR SCALED IFRAME AND LINK --- */

    .mini-preview-iframe {
        /* Size it like a big monitor screen */
        width: 1920px;
        height: 1080px;
        border: none;
        
        /* The scaling magic! Shrinks the large iframe to fit the small box */
        /* Calculation: 150px / 1920px ≈ 0.078 */
        transform: scale(0.078); 
        transform-origin: 0 0; /* Scales from the top-left corner */
        
        /* This makes the iframe non-interactive (no clicks, no scroll) */
        pointer-events: none; 
    }

    .open-link-icon {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        z-index: 1; /* Place it on top of the iframe */
        cursor: pointer;
        pointer-events: auto; /* IMPORTANT: Makes the link clickable */
        
        background-color: rgba(0, 0, 0, 0.4);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.2s, transform 0.2s;
    }

    .open-link-icon:hover {
        background-color: rgba(0, 0, 0, 0.7);
        transform: scale(1.1);
    }
    
    .open-link-icon svg {
        width: 14px;
        height: 14px;
        stroke: white;
        stroke-width: 2px;
    }

</style>
<body>
